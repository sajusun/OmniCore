version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: one_dashboard_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: "${APP_NAME:-OneDashboard}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-one_dashboard}"
      DB_USERNAME: "${DB_USERNAME:-one_user}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      REDIS_HOST: redis
      REDIS_PASSWORD: null
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      - db
      - redis
    networks:
      - one_network

  web:
    image: nginx:alpine
    container_name: one_dashboard_web
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - one_network

  db:
    image: mysql:8.0
    container_name: one_dashboard_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-one_dashboard}"
      MYSQL_USER: "${DB_USERNAME:-one_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "33066:3306"
    networks:
      - one_network

  redis:
    image: redis:7-alpine
    container_name: one_dashboard_redis
    restart: unless-stopped
    ports:
      - "63799:6379"
    volumes:
      - redisdata:/data
    networks:
      - one_network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: one_dashboard_queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    environment:
      APP_ENV: "${APP_ENV:-production}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-one_dashboard}"
      DB_USERNAME: "${DB_USERNAME:-one_user}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      - app
      - db
      - redis
    networks:
      - one_network

networks:
  one_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
